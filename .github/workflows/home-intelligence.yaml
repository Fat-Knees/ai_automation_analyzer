name: Home Intelligence runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install pinned genuine HA test environment
        run: python -m pip install -r requirements-runtime.txt
      - name: Record runtime versions
        run: |
          python --version
          python -m pip show homeassistant pytest-homeassistant-custom-component
      - name: Run real HA suite separately from upstream stubs
        run: python -m pytest -q runtime_tests -o asyncio_mode=auto --junitxml=runtime-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha-runtime-results
          path: runtime-results.xml
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test frontend_tests/*.test.mjs
